<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF0EE" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      SEO: o title abaixo e as tags de description, canonical, Open Graph e Twitter são
      preenchidos no build a partir de src/config/seo.ts e site.ts (plugin em vite.config.ts).
      O build também grava um HTML por rota (dist/servicos/index.html etc.) com as tags daquela página,
      para a prévia do WhatsApp; no navegador, o React Helmet Async assume essas tags.
    -->
    <title>May Salon</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Abertura (IntroAnimation): na primeira visita da sessão o fundo já nasce verde-escuro,
      para não piscar o ivory antes de a abertura aparecer. O React tira a classe no fim.
    -->
    <script>
      try {
        if (sessionStorage.getItem('may_intro_seen') !== '1' && !matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.documentElement.classList.add('intro-pendente')
      } catch (e) {}
    </script>
    <style>
      html.intro-pendente body { background: #1e2720; }
    </style>

    <!--
      Google Fonts: preconnect + preload para evitar texto invisível (font-display: swap).
      Fraunces é uma fonte variável: um único arquivo cobre peso (wght), itálico (ital) e o eixo
      óptico (opsz, que a própria fonte ajusta conforme o tamanho do texto) nos dois papéis,
      display e accent, no lugar de importar uma segunda serifa (Playfair + Cormorant).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&display=swap"
    />
  </head>
  <body>
    <noscript>
      Para a melhor experiência no May Salon, ative o JavaScript do seu navegador.
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
